[project]
name = "agentic-coding-agent"
version = "0.1.0"
description = "An autonomous agent that plans, writes, sandbox-executes, and verifies code against a fixed LeetCode-style eval set."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "google-genai",
    "tenacity",
    "psycopg[binary]",
    "pydantic",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
